# Builds signed installers for Windows, macOS, Linux and Android when a version
# tag is pushed, attaches them to a GitHub Release with an updater manifest
# (latest.json), and publishes the release once every platform succeeded.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the updater private key (required)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password; only if the key has one.
#                                       GitHub rejects empty secrets, and an
#                                       unset secret resolves to "", which is
#                                       what a passwordless key needs.
#   ANDROID_KEYSTORE                    the Android release keystore, base64 (required)
#   ANDROID_KEYSTORE_PASSWORD           its password (the key inside uses the same one)

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create or reuse draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "$TAG" > notes.md
          # Tags like v1.0.0-beta.1 become pre-releases (ignored by the updater).
          prerelease=false
          [[ "$TAG" == *-* ]] && prerelease=true

          # Reuse a release already made for this tag (e.g. a draft left by a
          # failed run), otherwise create one. The POST returns the id directly.
          # A draft whose tag was moved (deleted and re-pushed) loses its tag and
          # shows up as "untagged-…", so drafts are also matched by name, and
          # the PATCH re-attaches the tag.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\" or (.draft and .name == \"mono $TAG\"))][0].id // empty")
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
              -f tag_name="$TAG" -f name="mono $TAG" -F body=@notes.md -F draft=true -F prerelease=$prerelease > /dev/null
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" -f name="mono $TAG" -F body=@notes.md \
              -F draft=true -F prerelease=$prerelease --jq .id)
          fi

          if [[ -z "$id" ]]; then
            echo "::error::Could not create a release for $TAG"
            exit 1
          fi
          echo "Release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          # One universal app (Apple Silicon + Intel) so nobody downloads the
          # wrong one and ends up running it through Rosetta. Built on the Intel
          # runner pool: the Apple Silicon pool is often too busy to pick jobs
          # up, and cross-compiling the arm64 half works the same either way.
          - platform: macos-15-intel
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev libssl-dev

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.args }}

      - name: Stamp version and update endpoint
        shell: bash
        run: node scripts/prepare-release.mjs "$GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # Newer macOS no longer exports these; importing any of them stops the
      # app from launching. Failing here keeps the release a draft.
      - name: Check for removed macOS APIs
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          bin=src-tauri/target/universal-apple-darwin/release/mono
          removed='_(CGAcquireDisplayFadeReservation|CGDisplayFade|CGReleaseDisplayFadeReservation|CGRestorePermanentDisplayConfiguration|CGShieldingWindowLevel|SSLGetEnabledCiphers|SSLGetNumberEnabledCiphers|SSLSetPeerID|SSLSetSessionTicketsEnabled)$'
          if nm -u "$bin" | grep -E "$removed"; then
            echo "::error::$bin imports macOS functions that newer macOS no longer provides"
            exit 1
          fi
          echo "No removed macOS APIs imported by $bin"

  # Android: an arm64 APK (practically every phone since 2017), signed with
  # the release key so each version installs over the last.
  android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: android

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Stamp version
        run: node scripts/prepare-release.mjs "$GITHUB_REF_NAME"

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm tauri android build --target aarch64 --apk

      - name: Sign
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE" ]]; then
            echo "::error::The ANDROID_KEYSTORE secret is missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          apk="mono_${GITHUB_REF_NAME#v}_android_arm64.apk"
          "$bt/zipalign" -f -p 4             src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk             "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --ks-key-alias mono --out "$apk" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify "$apk"
          rm "$RUNNER_TEMP/release.jks"
          echo "APK=$apk" >> "$GITHUB_ENV"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          # Replace an APK left by an earlier run of this release.
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq ".[] | select(.name == \"$APK\") | .id")
          [[ -n "$old" ]] && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$old"
          curl -sSf -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Content-Type: application/vnd.android.package-archive"             --data-binary @"$APK"             "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$APK" > /dev/null
          echo "Attached $APK"

  publish:
    needs: [create-release, build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false > /dev/null
          echo "Published release $RELEASE_ID"
