[package]
name = "mono"
version = "0.1.0"
description = "A lightweight, directory-native audio player"
edition = "2021"
rust-version = "1.80"

[lib]
name = "mono_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1.11.3"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
base64 = "0.22"
walkdir = "2"
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "vorbis", "ogg", "aac", "isomp4"] }
cpal = "0.17.3"
rtrb = "0.4.1"
rubato = "0.15"
lofty = "0.22.2"
realfft = "3.5.1"
notify-debouncer-mini = "0.7.0"
discord-rich-presence = "1.1.0"
tauri-plugin-process = "2"
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "zip"] }

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
